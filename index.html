<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ant vs Giant Finger</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-shell">
    <div id="game"></div>
    <div id="touch-controls" aria-label="Touch controls">
      <button id="btn-left" class="ctrl-btn" aria-label="Move left">◀</button>
      <button id="btn-right" class="ctrl-btn" aria-label="Move right">▶</button>
      <button id="btn-jump" class="ctrl-btn jump" aria-label="Jump">⤒</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
